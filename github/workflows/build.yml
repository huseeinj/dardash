name: Build Dardash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o dardash_24h_media_flutter.zip -d project

      - name: Find Flutter project
        run: |
          echo "Searching for pubspec.yaml..."
          find project -name pubspec.yaml -print

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardash-apk
          path: project/**/build/app/outputs/flutter-apk/app-release.apk
